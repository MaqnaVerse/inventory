    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #050505; overflow: hidden; }

    #sa { position: fixed; top: 0; left: 0; width: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    iframe { display: block; width: 100%; height: 100%; border: none; opacity: 0; transition: opacity .4s ease; }
    iframe.ready { opacity: 1; }

    /* Splash semasa Apps Script sedang dimuatkan (biasanya 2–4 saat) */
    .splash { position: fixed; inset: 0; display: grid; place-items: center; background:
      radial-gradient(420px 320px at 20% 20%, rgba(168,85,247,.18), transparent 70%),
      radial-gradient(420px 320px at 85% 30%, rgba(239,68,68,.14), transparent 70%),
      radial-gradient(480px 340px at 55% 100%, rgba(250,204,21,.10), transparent 70%), #050505;

    .splash.hide { opacity: 0; pointer-events: none; }
    .splash div { text-align: center; }
    .splash img { width: 220px; max-width: 60vw; animation: breathe 1.8s ease-in-out infinite; }
    .splash p { margin-top: 22px; font: 600 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .32em; color: #6b6b76; }
    .bar { width: 160px; height: 3px; margin: 16px auto 0; border-radius: 3px; background: #1a1a1f; overflow: hidden; }
    .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #a855f7, #ef4444, #facc15); animation: slide 1.2s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(.96); opacity: .8; } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    /* Kamera scan (jika kamera disekat dalam iframe Google) */
    .cam { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.92); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; font-family: system-ui, sans-serif; color: #fff; }
    .cam.on { display: flex; }
    .cam .box { position: relative; width: min(92vw, 440px); aspect-ratio: 1/1; border-radius: 20px; overflow: hidden; background: #000; border: 1px solid #333; }
    .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cam .fr { position: absolute; inset: 16%; border: 3px solid #a855f7; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); }
    .cam p { margin: 0; color: #a1a1aa; font-size: 13px; text-align: center; }
    .cam button { background: #fff; color: #0a0a0a; border: 0; padding: 12px 26px; border-radius: 999px; font-weight: 700; font-size: 14px; }

  <!--
    MAQNA Inventory — jambatan storan sesi
    App berjalan dalam iframe domain Google. iPhone (Safari / Home Screen) dan pelayar yang sekat
    third-party storage tidak benarkan iframe simpan data, jadi login hilang bila app ditutup.
    Skrip ini simpan token sesi pada halaman GitHub ini (storan kekal).
    Hanya menerima mesej daripada app Apps Script (…-script.googleusercontent.com).
  -->
  <script>
  /* ============================================================
     TAMPAL URL WEB APP APPS SCRIPT (berakhir dengan /exec) DI SINI
     ============================================================ */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxtCaTvmfsUvX8yALxLQa8SyOTZfKx1Cgm6z-yjhoqkNu5sMDK3Gwm4Q4NZ18BXojb_0w/exec';

  (function () {
    // Hantar ?i=<SKU> dari QR label terus ke app
    var q = location.search || '';
    var m = q.match(/[?&](i|item)=([^&#]+)/);
    document.getElementById('app').src = APP_URL + (m ? (APP_URL.indexOf('?') > -1 ? '&' : '?') + 'i=' + m[2] : '');
  })();

  (function () {
    var PREFIX = 'maqna_inv_';
    var FROM = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
    var frame = document.getElementById('app'), splash = document.getElementById('splash');

    function ready() { frame.classList.add('ready'); splash.classList.add('hide'); }
    frame.addEventListener('load', function () { setTimeout(ready, 600); });
    setTimeout(ready, 8000); // jaga-jaga

    /* ---- Safe area iPhone (notch / Dynamic Island / home bar) ----
       iframe tak dapat env(safe-area-inset-*), jadi wrapper ukur & hantar ke app.
       iOS "Add to Home Screen": 100% tinggi kadang pendek → guna tinggi skrin penuh. */
    var peer = null;
    function insets() {
      var cs = getComputedStyle(document.getElementById('sa'));
      return { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 };
    }
    function fit() {
      var box = document.querySelector('.iframe-container'), h = window.innerHeight;
      if (navigator.standalone === true) {
        var land = window.matchMedia('(orientation: landscape)').matches;
        var sh = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
        if (sh > h) h = sh;
      }
      box.style.setProperty('--vh', h + 'px');
      if (peer) try { peer.src.postMessage({ app: 'maqna-inv', op: 'insets', value: insets() }, peer.origin); } catch (err) {}
    }
    fit();
    window.addEventListener('resize', function () { setTimeout(fit, 60); });
    window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });

    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!FROM.test(e.origin) || !d || d.app !== 'maqna-inv' || !e.source) return;
      peer = { src: e.source, origin: e.origin };
      if (d.op === 'ready') { ready(); return; }
      if (d.op === 'insets') { e.source.postMessage({ app: 'maqna-inv', id: d.id, value: insets() }, e.origin); return; }
      if (d.op === 'scan') { camStart(e.source, e.origin, d.id); return; }
      if (d.op === 'scanCancel') { camStop(); return; }
      if (['get', 'set', 'del'].indexOf(d.op) < 0 || !/^[a-z_]{1,20}$/.test(String(d.key))) return;
      var out = { app: 'maqna-inv', id: d.id };
      try {
        if (d.op === 'get') out.value = localStorage.getItem(PREFIX + d.key);
        else if (d.op === 'set') localStorage.setItem(PREFIX + d.key, String(d.value).slice(0, 4000));
        else localStorage.removeItem(PREFIX + d.key);
      } catch (err) { out.error = String(err); }
      e.source.postMessage(out, e.origin);
    });

    /* ---- Kamera scan QR untuk app (BarcodeDetector / jsQR) ---- */
    var cam = { stream: null, t: null, det: null, cv: null, reply: null };
    function load(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
    function camStop() { clearTimeout(cam.t); if (cam.stream) cam.stream.getTracks().forEach(function (t) { t.stop(); }); cam.stream = null; document.getElementById('cam').classList.remove('on'); }
    function camReply(v) { var r = cam.reply; cam.reply = null; camStop(); if (r) r.src.postMessage({ app: 'maqna-inv', id: r.id, value: v }, r.origin); }
    document.getElementById('camX').onclick = function () { camReply('__cancel__'); };
    async function camStart(src, origin, id) {
      if (cam.reply) camReply('__cancel__');
      cam.reply = { src: src, origin: origin, id: id };
      document.getElementById('cam').classList.add('on'); document.getElementById('camMsg').textContent = 'Menghidupkan kamera…';
      try {
        cam.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        var v = document.getElementById('camV'); v.srcObject = cam.stream; await v.play();
        if ('BarcodeDetector' in window) { try { var f = await BarcodeDetector.getSupportedFormats(); if (f.indexOf('qr_code') > -1) cam.det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (x) { } }
        if (!cam.det && !window.jsQR) await load('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js');
        document.getElementById('camMsg').textContent = 'Halakan kamera ke label QR';
        (function loop() { cam.t = setTimeout(async function () {
          if (!cam.stream) return;
          try {
            var txt = null;
            if (v.readyState >= 2 && v.videoWidth) {
              if (cam.det) { var r = await cam.det.detect(v); if (r && r[0]) txt = r[0].rawValue; }
              else if (window.jsQR) { var c = cam.cv || (cam.cv = document.createElement('canvas')), w = Math.min(720, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
                c.width = w; c.height = h; var g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(v, 0, 0, w, h);
                var q = jsQR(g.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' }); if (q) txt = q.data; }
            }
            if (txt) { try { navigator.vibrate && navigator.vibrate(60); } catch (x) { } return camReply(txt); }
          } catch (x) { }
          loop();
        }, 160); })();
      } catch (err) { camReply('__nocam__'); }
    }

    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (err) { }
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  })();
  </script>
